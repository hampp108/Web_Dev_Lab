<!DOCTYPE html>
<html>
<head>
    <title>Sticky Navbar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="home">
        <h2>Welcome</h2>
        <p>This is my website.</p>
    </section>

    <section class="card">
        <img src="https://placehold.co/500x250"
             alt="Sample project">

        <div class="overlay">
            <h2>My Project</h2>
            <p>Created using HTML and CSS.</p>
        </div>
    </section>

    <section id="about">
        <h2>About Me</h2>
        <p>This is the about section.</p>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>Email: example@gmail.com</p>
    </section>

</body>
</html>
