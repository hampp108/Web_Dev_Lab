<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Header and Footer</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: flex; flex-direction: column; font-family: Arial, sans-serif; }
    header, footer { background: #243f55; color: white; padding: 20px 7%; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    nav { display: flex; gap: 18px; flex-wrap: wrap; }
    nav a, footer a { color: white; text-decoration: none; }
    main { flex: 1; padding: 35px 7%; }
    footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  </style>
</head>
<body>
  <header><h1>My Portfolio</h1><nav><a href="#">Home</a><a href="#">Work</a><a href="#">Contact</a></nav></header>
  <main><h2>Welcome</h2><p>This layout uses Flexbox to arrange the header and footer content.</p></main>
  <footer><span>© 2026 My Portfolio</span><a href="mailto:student@example.com">Email</a></footer>
</body>
</html>
