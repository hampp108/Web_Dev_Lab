<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects Grid</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:30px;font-family:Arial,sans-serif;background:#f5f7f8}
.projects{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(150px,auto);gap:18px}
.project{background:white;padding:22px;border-radius:8px}
.project:first-child,.project:last-child{grid-column:span 2}
@media(max-width:700px){.projects{grid-template-columns:1fr}.project:first-child,.project:last-child{grid-column:auto}}
</style>
</head>
<body>
<h1>My Projects</h1>
<main class="projects">
<article class="project"><h2>Portfolio Website</h2><p>A personal website made with HTML and CSS.</p></article>
<article class="project"><h2>Bio Page</h2><p>A semantic introduction page.</p></article>
<article class="project"><h2>News Layout</h2><p>A three-column page using CSS Grid.</p></article>
<article class="project"><h2>Responsive Cards</h2><p>A flexible card layout for different screens.</p></article>
</main>
</body>
</html>
